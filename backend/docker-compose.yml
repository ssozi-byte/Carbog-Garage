services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: motora
      POSTGRES_PASSWORD: motora
      POSTGRES_DB: motora
    ports:
      - '5433:5432' # host 5433 — 5432 may be used by other local projects
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U motora']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Phase 9 dev object storage (S3-compatible, private bucket semantics)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: motora
      MINIO_ROOT_PASSWORD: motora-dev-secret
    ports:
      - '9002:9000'
      - '9003:9001'
    volumes:
      - miniodata:/data

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://motora:motora@postgres:5432/motora?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
